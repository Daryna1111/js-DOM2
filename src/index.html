<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея зображень</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="gallery-title">Галерея світлин</h1>
      <p class="gallery-info" id="gallery-info">Завантаження зображень...</p>
    </header>

    <main class="gallery" id="gallery"></main>

    <div class="controls">
      <button type="button" class="btn btn-primary" id="load-more-btn">
        Завантажити ще 4 картинки
      </button>
      <button type="button" class="btn btn-secondary" id="reverse-btn">
        Перевернути галерею
      </button>
      <button type="button" class="btn btn-warning" id="remove-last-btn">
        Видалити останню картинку
      </button>
      <button type="button" class="btn btn-danger" id="clear-btn">
        Очистити галерею
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
